<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Sosyal önizleme. Marka işareti brand/hophop-icon.svg ile birebir aynı. -->
  <defs>
    <linearGradient id="icon" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF7A65"/>
      <stop offset=".34" stop-color="#FF939D"/>
      <stop offset=".68" stop-color="#DC6EBA"/>
      <stop offset="1" stop-color="#B266D5"/>
    </linearGradient>
    <radialGradient id="sky" cx="50%" cy="0%" r="100%">
      <stop offset="0" stop-color="#281433"/>
      <stop offset=".5" stop-color="#1B1024"/>
      <stop offset="1" stop-color="#120A17"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="110"/>
    </filter>
    <clipPath id="squircle"><rect width="192" height="192" rx="42" ry="42"/></clipPath>
  </defs>

  <rect width="1200" height="630" fill="url(#sky)"/>
  <g filter="url(#soft)" opacity=".30">
    <circle cx="180" cy="90" r="280" fill="#FF7A65"/>
    <circle cx="1080" cy="240" r="260" fill="#DC6EBA"/>
    <circle cx="520" cy="700" r="300" fill="#B266D5"/>
  </g>

  <!-- Uygulama ikonu (192 birimlik master, 1.25 ölçekle 240 px) -->
  <g transform="translate(150 195) scale(1.25)">
    <g clip-path="url(#squircle)">
      <rect width="192" height="192" fill="url(#icon)"/>
      <g transform="rotate(-8 56.5 46)">
        <rect x="35" y="6" width="43" height="80" rx="21.5" fill="#fff"/>
        <rect x="43.5" y="17" width="26" height="58" rx="13" fill="#FFB2C8"/>
      </g>
      <g transform="rotate(8 135.5 46)">
        <rect x="114" y="6" width="43" height="80" rx="21.5" fill="#fff"/>
        <rect x="122.5" y="17" width="26" height="58" rx="13" fill="#FFB2C8"/>
      </g>
      <circle cx="95.5" cy="107.5" r="56.5" fill="#fff"/>
      <ellipse cx="56.5" cy="123.5" rx="10" ry="6" fill="#FFC5D0"/>
      <ellipse cx="134.5" cy="123.5" rx="10" ry="6" fill="#FFC5D0"/>
      <g fill="#34213A">
        <ellipse cx="71" cy="109" rx="6" ry="6.5"/>
        <ellipse cx="120" cy="109" rx="6" ry="6.5"/>
      </g>
      <g fill="#fff" opacity=".9">
        <circle cx="68.8" cy="106.4" r="2"/><circle cx="117.8" cy="106.4" r="2"/>
      </g>
      <ellipse cx="95.5" cy="118.5" rx="6" ry="4" fill="#FF78A0"/>
      <path d="M88 125.5 Q95.5 132 103 125.5" fill="none" stroke="#34213A"
            stroke-width="2.4" stroke-linecap="round"/>
    </g>
  </g>

  <g font-family="Manrope, Segoe UI, Helvetica, Arial, sans-serif">
    <text x="450" y="290" fill="#F3F5FF" font-size="96" font-weight="800" letter-spacing="-3">HopHop</text>
    <text x="450" y="358" fill="#F3F5FF" font-size="40" font-weight="700">Ailenle görüntülü konuş.</text>
    <text x="452" y="414" fill="#D2BACD" font-size="27" font-weight="500">Uçtan uca şifreli · Yüz efektleri · Sadece davetle</text>
  </g>
</svg>
