<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <!--
    HopHop marka işareti — TEK KAYNAK.

    Uygulama ikonundan (mipmap/ic_launcher.png) ölçülerek vektöre çevrildi:
    kafa merkez (95.5, 107.5) r 56.5 · kulaklar 43x80 · gözler (71,109) ve
    (120,109) · burun (95.5, 118.5) · allık (56.5, 123.5) ve (134.5, 123.5).

    Buradan türetilenler: uygulama içi marka (assets/brand/), tanıtım sayfası
    favicon'u ve og görseli. Tavşanı değiştirirsen brand/render.sh ile hepsini
    yeniden üret — böylece "farklı farklı tavşanlar" sorunu geri gelmez.
  -->
  <defs>
    <!-- Özgün ikon dört köşesi farklı bir örgü degrade; tek eksenli degradeyle
         en iyi yaklaşım sağ-üstten sol-alta, aradaki pembe/macenta duraklarla. -->
    <linearGradient id="bg" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF7A65"/>
      <stop offset=".34" stop-color="#FF939D"/>
      <stop offset=".68" stop-color="#DC6EBA"/>
      <stop offset="1" stop-color="#B266D5"/>
    </linearGradient>
    <clipPath id="squircle">
      <rect x="0" y="0" width="192" height="192" rx="42" ry="42"/>
    </clipPath>
  </defs>

  <g clip-path="url(#squircle)">
    <rect width="192" height="192" fill="url(#bg)"/>

    <!-- Kulaklar: dışta beyaz kabuk, içte pembe -->
    <g>
      <g transform="rotate(-8 56.5 46)">
        <rect x="35" y="6" width="43" height="80" rx="21.5" fill="#fff"/>
        <rect x="43.5" y="17" width="26" height="58" rx="13" fill="#FFB2C8"/>
      </g>
      <g transform="rotate(8 135.5 46)">
        <rect x="114" y="6" width="43" height="80" rx="21.5" fill="#fff"/>
        <rect x="122.5" y="17" width="26" height="58" rx="13" fill="#FFB2C8"/>
      </g>
    </g>

    <!-- Kafa -->
    <circle cx="95.5" cy="107.5" r="56.5" fill="#fff"/>

    <!-- Allık -->
    <ellipse cx="56.5" cy="123.5" rx="10" ry="6" fill="#FFC5D0"/>
    <ellipse cx="134.5" cy="123.5" rx="10" ry="6" fill="#FFC5D0"/>

    <!-- Gözler (parlaklık noktasıyla) -->
    <g fill="#34213A">
      <ellipse cx="71" cy="109" rx="6" ry="6.5"/>
      <ellipse cx="120" cy="109" rx="6" ry="6.5"/>
    </g>
    <g fill="#fff" opacity=".9">
      <circle cx="68.8" cy="106.4" r="2"/>
      <circle cx="117.8" cy="106.4" r="2"/>
    </g>

    <!-- Burun ve ağız -->
    <ellipse cx="95.5" cy="118.5" rx="6" ry="4" fill="#FF78A0"/>
    <path d="M88 125.5 Q95.5 132 103 125.5" fill="none" stroke="#34213A"
          stroke-width="2.4" stroke-linecap="round"/>
  </g>
</svg>
