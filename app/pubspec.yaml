name: hophop
description: HopHop — aile içi sesli/görüntülü görüşme uygulaması.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.2.0
  livekit_client: ^2.3.0
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.0
  flutter_local_notifications: ^18.0.0
  flutter_foreground_task: ^8.10.0
  flutter_secure_storage: ^9.2.0
  permission_handler: ^11.3.0
  cryptography: ^2.7.0
  google_mlkit_face_detection: ^0.12.0
  image_picker: ^1.1.0
  flutter_image_compress: ^2.3.0
  device_info_plus: ^10.1.0
  path_provider: ^2.1.0
  intl: ^0.20.2

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
