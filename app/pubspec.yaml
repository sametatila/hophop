name: hophop
description: HopHop — aile içi sesli/görüntülü görüşme uygulaması.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.2.0
  livekit_client: ^2.3.0
  firebase_core: ^4.13.0
  firebase_messaging: ^16.5.0
  flutter_local_notifications: ^22.3.0
  flutter_foreground_task: ^10.0.0
  flutter_secure_storage: ^11.0.0
  permission_handler: ^13.0.1
  cryptography: ^2.7.0
  google_mlkit_face_detection: ^0.14.0
  image_picker: ^1.1.0
  flutter_image_compress: ^2.3.0
  device_info_plus: ^13.2.0
  path_provider: ^2.1.0
  intl: ^0.20.2

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
